<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatFlow</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0F0E17;
      color: #F4F4F8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      direction: rtl;
    }
    .card {
      background: #1A1927;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 36px;
      max-width: 440px;
      text-align: center;
    }
    h2 { margin-bottom: 12px; color: #6C63FF; }
    p { color: #9B9BB0; font-size: 14px; margin-bottom: 20px; line-height: 1.6; }
    button {
      padding: 12px 24px;
      background: #6C63FF;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size: 48px; margin-bottom: 12px;">💬</div>
    <h2>هەڵە لە پەیوەندی</h2>
    <p>تکایە دڵنیابەرەوە لە سێرڤەرەکە، پاشان دووبارە تاقی بکەرەوە.</p>
    <button onclick="location.reload()">دووبارە تاقی بکەرەوە</button>
  </div>
</body>
</html>
