<!DOCTYPE html>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans Arabic', sans-serif;
      background: #0F0E17;
      color: #F4F4F8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      direction: rtl;
    }
    .card {
      background: rgba(26, 25, 39, 0.95);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 40px;
      width: 100%;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 16px 48px rgba(0,0,0,0.5);
    }
    .icon {
      font-size: 56px;
      margin-bottom: 16px;
      display: inline-block;
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #6C63FF, #FF6584);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #9B9BB0;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .input-group {
      text-align: right;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      color: #9B9BB0;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      background: #252336;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      color: white;
      font-family: inherit;
      font-size: 14px;
      direction: ltr;
      text-align: left;
      outline: none;
      transition: 0.3s;
    }
    input:focus {
      border-color: #6C63FF;
      box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.25);
    }
    .presets {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    .preset-btn {
      flex: 1;
      padding: 8px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      color: #9B9BB0;
      font-size: 12px;
      cursor: pointer;
      transition: 0.2s;
      font-family: inherit;
    }
    .preset-btn:hover {
      background: rgba(108, 99, 255, 0.2);
      color: white;
      border-color: #6C63FF;
    }
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #6C63FF, #8B85FF);
      border: none;
      border-radius: 12px;
      color: white;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      margin-bottom: 12px;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(108, 99, 255, 0.4);
    }
    .btn-secondary {
      width: 100%;
      padding: 12px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      color: #9B9BB0;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.05);
      color: white;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 100px;
      font-size: 12px;
      background: rgba(255, 101, 132, 0.15);
      color: #FF6584;
      margin-bottom: 16px;
    }
  </style>
</head>

    <div class="input-group">
      <label>????????? ?????? (Server URL):</label>
      <input type="text" id="serverInput" value="http://62.201.232.190:3000" placeholder="http://62.201.232.190:3000">
    </div>

    <div class="presets">
      <button class="preset-btn" onclick="setPreset('http://62.201.232.190:3000')">?? ??????? ??????</button>
      <button class="preset-btn" onclick="setPreset('http://localhost:3000')">?? ????? ????</button>

    <button class="btn-primary" onclick="connect()">??????? ???????? ????????</button>
    <button class="btn-secondary" onclick="startLocal()">?? ??????????? ??????? ?????</button>
  </div>

  <script>
    async function init() {
      if (window.electronAPI) {
        const savedUrl = await window.electronAPI.getServerUrl();
        if (savedUrl) document.getElementById('serverInput').value = savedUrl;
      }
    }
    init();

    function setPreset(url) {
      document.getElementById('serverInput').value = url;
    }

    async function connect() {
      const url = document.getElementById('serverInput').value.trim();
      if (!url) return;
      if (window.electronAPI) {
        await window.electronAPI.setServerUrl(url);
      } else {
        window.location.href = url;
      }
    }

    async function startLocal() {
      if (window.electronAPI) {
        const res = await window.electronAPI.startLocalServer();
        if (!res.success) {
          alert('???? ?? ??????????? ??????: ' + res.message);
        }
      } else {
        alert('????? ?? ???????? ?? node server.js ?????');
      }
    }
  </script>
